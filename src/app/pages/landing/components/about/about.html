<section class="about-section">
  <div class="about-header">
    <span class="about-kicker font-display">{{ 'about.kicker' | transloco }}</span>
    <h2 class="about-title font-display">{{ 'about.title' | transloco }}</h2>
  </div>

  <div class="about-grid">
    @for (i of cards; track i) {
      <div class="about-card sc-hover-card">
        <span class="about-card-number font-display">{{ '0' + (i + 1) }}</span>
        <h3 class="about-card-title">{{ 'about.card' + i + '.title' | transloco }}</h3>
        <p class="about-card-body">{{ 'about.card' + i + '.body' | transloco }}</p>
      </div>
    }
  </div>
</section>
