<section id="how-it-works" class="how-it-works-section">
  <div class="how-header">
    <h2 class="how-title font-display">{{ 'howItWorks.titlePlain' | transloco }}</h2>
  </div>

  <div class="how-grid">
    <div class="how-connector" aria-hidden="true"></div>
    @for (i of steps; track i) {
      <div class="how-step">
        <div class="how-badge font-display">{{ '0' + (i + 1) }}</div>
        <h3 class="how-step-title">{{ 'howItWorks.step' + i + '.title' | transloco }}</h3>
        <p class="how-step-body">{{ 'howItWorks.step' + i + '.body' | transloco }}</p>
      </div>
    }
  </div>
</section>
