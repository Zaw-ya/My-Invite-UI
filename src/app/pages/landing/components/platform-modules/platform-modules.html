<section id="platform" class="platform-section py-20 bg-slate-50 border-y border-slate-200">
  <div class="platform-inner max-w-6xl mx-auto px-4">
    <div class="platform-header text-center mb-12">
      <h2 class="platform-title text-3xl md:text-4xl font-extrabold text-slate-900 font-display">
        {{ 'platform.title' | transloco }}
      </h2>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-7 gap-5">
      @for (category of categories; track category.key) {
        <div class="platform-card bg-white border border-slate-200/80 rounded-2xl p-6 text-center flex flex-col items-center gap-3 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all cursor-pointer">
          <div class="platform-card-icon w-14 h-14 rounded-full bg-amber-50 flex items-center justify-center">
            <lucide-icon [name]="category.icon" [size]="26" [strokeWidth]="1.5"></lucide-icon>
          </div>
          <h3 class="platform-card-title text-base font-bold text-slate-900">{{ category.key | transloco }}</h3>
        </div>
      }
    </div>
  </div>
</section>
