<section class="privacy-section">
  <div class="privacy-inner">
    <svg width="116" height="75" viewBox="0 0 24 24" fill="none" stroke="url(#goldGrad)" stroke-width="1.4" class="privacy-badge-icon">
      <path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3z"></path>
      <path d="M9 12l2 2 4-4"></path>
    </svg>
    <h2 class="privacy-title font-display">{{ 'privacy.title' | transloco }}</h2>
    <p class="privacy-body">{{ 'privacy.body' | transloco }}</p>

    <div class="privacy-grid">
      <div class="privacy-item">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="url(#goldGrad)" stroke-width="1.4" class="privacy-item-icon">
          <rect x="5" y="11" width="14" height="9" rx="1.5"></rect>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
        <div>
          <h3 class="privacy-item-title">{{ 'privacy.item0.title' | transloco }}</h3>
          <p class="privacy-item-body">{{ 'privacy.item0.body' | transloco }}</p>
        </div>
      </div>

      <div class="privacy-item">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="url(#goldGrad)" stroke-width="1.4" class="privacy-item-icon">
          <path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"></path>
        </svg>
        <div>
          <h3 class="privacy-item-title">{{ 'privacy.item1.title' | transloco }}</h3>
          <p class="privacy-item-body">{{ 'privacy.item1.body' | transloco }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
