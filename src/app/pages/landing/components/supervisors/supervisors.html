<section class="section-py supervisors-section" style="background-color: var(--bg-secondary);">
  <div class="container mx-auto px-5 max-w-5xl">

    <!-- Header -->
    <div class="text-center mb-10 space-y-3">
      <h2 class="section-title" [innerHTML]="'supervisors.heading' | transloco"></h2>
      <div class="gold-divider mx-auto" style="width:48px;"></div>
    </div>

    <!-- Supervisor / staff photos. Real, dynamic Packages pricing already
         lives in <app-pricing> at #packages — this component previously
         also rendered a second, static, hardcoded pricing table as its
         default tab (ahead of its own namesake staff content), which
         duplicated that section. Removed; this component now shows only
         what it's named for. -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-6 mb-8">
      @for (s of supervisors(); track s.id) {
        <div class="sup-card">
          <div class="sup-card-img-fill">
            <img [src]="s.imageUrl" [alt]="s.name" (error)="showInitial($event)">
          </div>
          <div class="sup-card-body">
            <h3 class="font-black text-lg" style="color: var(--text);">{{ s.name }}</h3>
            <p class="text-sm font-bold" style="color: var(--gold);">{{ s.role }}</p>
          </div>
        </div>
      }
    </div>

    <!-- Cities (black) -->
    <div class="cities-box text-start mb-10">
      <p class="font-black mb-3 cities-title">{{ 'supervisors.citiesTitle' | transloco }}</p>
      <p class="text-sm mb-3 cities-sub" [innerHTML]="'supervisors.citiesSubtitle' | transloco"></p>
      <div class="grid sm:grid-cols-1 gap-x-8 gap-y-2">
        <div class="space-y-1">
          <!-- Backend-provided country/city names stay exactly as received. -->
          @for (c of dynamicCities(); track c.country) {
            <p class="text-sm cities-text" dir="rtl">
              <span class="cities-highlight">{{ c.country }}:</span> {{ c.cities }}
            </p>
          }
        </div>
      </div>
    </div>


  </div>
</section>
