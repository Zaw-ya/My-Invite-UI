<main class="not-found">
  <p class="not-found__code">404</p>
  <h1 class="not-found__title">{{ 'notFoundPage.title' | transloco }}</h1>
  <p class="not-found__message">
    {{ 'notFoundPage.message' | transloco }}
  </p>
  <a class="not-found__link" [routerLink]="['/', languageService.activeLanguage().code]">{{ 'notFoundPage.linkText' | transloco }}</a>
</main>
